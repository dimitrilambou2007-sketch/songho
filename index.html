<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songho - Jeu Traditionnel Camerounais</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header avec thème -->
        <div class="header">
            <div class="logo">
                <i class="fas fa-chess-board"></i>
                <h1>SONGHO</h1>
                <span class="subtitle">Jeu de stratégie camerounais</span>
            </div>
            <button id="themeToggle" class="theme-btn">
                <i class="fas fa-moon"></i>
                <span>Thème sombre</span>
            </button>
        </div>

        <!-- Cartes des scores -->
        <div class="score-cards">
            <div class="score-card player1-card">
                <div class="avatar">
                    <i class="fas fa-user"></i>
                </div>
                <h3>Joueur 1</h3>
                <div class="score-value" id="scoreJ1">0</div>
                <div class="badge">⬇️ Bas</div>
            </div>
            <div class="vs">
                <i class="fas fa-gripfire"></i>
            </div>
            <div class="score-card player2-card">
                <div class="avatar">
                    <i class="fas fa-user-astronaut"></i>
                </div>
                <h3>Joueur 2</h3>
                <div class="score-value" id="scoreJ2">0</div>
                <div class="badge">⬆️ Haut</div>
            </div>
        </div>

        <!-- Plateau de jeu -->
        <div class="game-board">
            <div id="plateau"></div>
        </div>

        <!-- Contrôles -->
        <div class="game-controls">
            <div class="turn-indicator" id="messageTour">
                <i class="fas fa-hourglass-half"></i>
                <span>🎯 Tour du Joueur 1</span>
            </div>
            <button id="resetBtn" class="reset-btn">
                <i class="fas fa-sync-alt"></i>
                Nouvelle partie
            </button>
        </div>

        <!-- Message d'information -->
        <div id="infoMessage" class="info-message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
